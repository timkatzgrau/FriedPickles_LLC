<!doctype html>
<html lang="en">
<head><meta charset="utf-8" />
<style>
@font-face{font-family:Mona;src:url('http://localhost:4173/assets/fonts/mona-sans.woff2');font-weight:200 900}
*{box-sizing:border-box}body{margin:0;width:1200px;height:630px;background:#fff;color:#183c38;font-family:Mona,Arial,sans-serif;padding:55px 66px;display:flex;flex-direction:column;overflow:hidden}
.brand{display:flex;align-items:center;gap:14px;font-size:27px;font-weight:620;letter-spacing:-1px}.mark{background:#fff;border-radius:14px;padding:5px;width:52px;height:52px}.brand small{display:block;font-size:11px;letter-spacing:2px;margin-top:3px}
h1{font-size:79px;font-weight:560;letter-spacing:-5px;line-height:1.06;margin:50px 0 20px;max-width:1000px}p{font-size:23px;color:#617068;line-height:1.45;margin:0;max-width:990px}
.bottom{margin-top:auto;display:flex;align-items:center;gap:15px}.product{height:82px;width:280px;padding:17px 29px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid #dce4df}.chill{width:170px;height:auto}.repair{width:221px;height:auto}.domain{margin-left:auto;font-size:18px;color:#617068}
</style></head>
<body>
<div class="brand"><img class="mark" src="http://localhost:4173/assets/brand/mark.svg" alt="" /><span>Fried Pickles<small>LLC</small></span></div>
<h1>{{title}}</h1><p>{{subtitle}}</p>
<div class="bottom"><div class="product"><img class="chill" src="http://localhost:4173/assets/brand/chillmaps-wordmark.webp" alt="ChillMaps" /></div><div class="product"><img class="repair" src="http://localhost:4173/assets/brand/repairseeker-wordmark.svg" alt="RepairSeeker" /></div><span class="domain">friedpicklesllc.com</span></div>
</body></html>
